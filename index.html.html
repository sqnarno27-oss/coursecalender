.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:24px;font-weight:800;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700}

.btn.del{background:var(--s4)}

.sp{flex:1}
.nav{display:flex;align-items:center;gap:8px}

.dow.we{opacity:.55}
.day{background:var(--card);min-height:104px;padding:4px;cursor:pointer;overflow:hidden}
.day.off{background:var(--off);cursor:default}
.day.we{background:var(--off)}
.day.today{box-shadow:inset 0 0 0 2px var(--acc)}

.dn i{font-style:normal;color:var(--acc);font-weight:700}

.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--off);font-size:13px;color:var(--mute)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accbg)}

.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:480px;max-height:100%;overflow:auto}
.modal h3{margin:0 0 12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
.f .w{grid-column:1/-1}
.f input,.f select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.acts{display:flex;gap:8px;margin-top:14px}
.err{color:var(--s4);font-size:13px;min-height:18px;margin-top:6px}
.empty{padding:28px;text-align:center;color:var(--mute)}

</style>
</head>

والمنظومة القتالية", "start": "2027-03-07", "end": "2027-03-25", "n": "7", "time": "", "venue": "", "note": "", "status": "مؤكدة"}, {"id": "d48", "name": "S&BC-01/27 دورة البحث والتفتيش", "ent": "مدرسة العمليات (البحث والتفتيش)", "start": "2027-01-10", "end": "2027-01-14", "n": "10", "time": "", "venue": "", "note": "", "status": "مؤكدة"}, {"id": "d49", "name": "S&BC-02/27 دورة البحث والتفتيش", "ent": "مدرسة العمليات (البحث والتفتيش)", "start": "2027-01-24", "end": "2027-01-28", "n": "10", "time": "", "venue": "", "note": "", "status": "مؤكدة"}, {"id": "d50", "name": "S&BC-03/27 دورة البحث والتفتيش", "ent": "مدرسة العمليات (البحث والتفتيش)", "start": "2027-02-07", "end": "2027-02-11", "n": "10", "time": "", "venue": "", "note": "", "status": "مؤكدة"}, {"id": "d51", "name": "S&BC-04/27 دورة البحث والتفتيش", "ent": "مدرسة العمليات (البحث والتفتيش)", "start": "2027-02-21", "end": "2027-02-25", "n": "10", "time": "", "venue": "", "note": "", "status": "مؤكدة"}, {"id": "d52", "name": "S&BC-05/27 دورة البحث والتفتيش", "ent": "مدرسة العمليات (البحث والتفتيش)", "start": "2027-03-28", "end": "2027-04-01", "n": "10", "time": "", "venue": "", "note": "", "status": "مؤكدة"}];var data=DEF.slice(),view="month",mi=0,editId=null,pendingDate=null;
try{var r=localStorage.getItem(KEY);if(r)data=JSON.parse(r)||[]}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function $(i){return document.getElementById(i)}
function iso(y,m,d){return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function vis(){var e=$("fe").value;return e?data.filter(function(c){return c.ent===e}):data}
function ents(){var s={};data.forEach(function(c){if(c.ent)s[c.ent]=1});return Object.keys(s)}
function fillEnts(){var cur=$("fe").value,o=ents();$("fe").innerHTML='<option value="">كل الجهات</option>'+o.map(function(x){return"<option>"+esc(x)+"</option>"}).join("");$("fe").value=o.indexOf(cur)>-1?cur:"";$("ents").innerHTML=o.map(function(x){return"<option value=\""+esc(x)+"\">"}).join("")}
function active(d){return vis().filter(function(c){return c.start<=d&&d<=c.end})}

$("fSt").innerHTML=Object.keys(ST).map(function(k){return"<option>"+k+"</option>"}).join("");
$("legend").innerHTML=Object.keys(ST).map(function(k){return'<span style="--c:'+ST[k]+'">'+k+"</span>"}).join("");

function render(){
  fillEnts();
  $("sTotal").textContent=data.length;
  $("sConf").textContent=data.filter(function(c){return c.status==="مؤكدة"}).length;
  var m=mi+1,last=new Date(2027,m,0).getDate();
  $("sMonth").textContent=vis().filter(function(c){return c.start<=iso(2027,m,last)&&c.end>=iso(2027,m,1)}).length;
  $("nav").style.display=view==="month"?"flex":"none";
  $("q").style.display=view==="list"?"":"none";$("fe").style.display=view==="week"?"none":"";
  document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===view)});
  $("mt").textContent=MON[mi]+" 2027";
  $("prev").disabled=mi===0;$("next").disabled=mi===3;
  if(view==="month")renderMonth();else if(view==="list")renderList();else renderWeeks();
}
function renderMonth(){
  var m=mi+1,last=new Date(2027,m,0).getDate(),first=new Date(2027,mi,1).getDay(),h="";
  DOW.forEach(function(d,i){h+='<div class="dow'+(i>4?" we":"")+'">'+d+"</div>"});
  for(var i=0;i<first;i++)h+='<div class="day off"></div>';
  for(var d=1;d<=last;d++){
    var k=iso(2027,m,d),dw=(first+d-1)%7,inT=k>=TERM_S&&k<=TERM_E,a=inT?active(k):[];
    var cls="day"+(!inT?" off":dw>4?" we":"");
    h+='<div class="'+cls+'" data-d="'+(inT?k:"")+'"><div class="dn"><span>'+d+"</span>"+(a.length?"<i>"+a.length+"</i>":"")+"</div>";
    a.slice(0,3).forEach(function(c){h+='<button class="chip" style="--c:'+ST[c.status]+'" data-id="'+c.id+'" title="'+esc(c.name+" – "+c.ent)+'">'+esc(c.name)+"</button>"});
    if(a.length>3)h+='<div class="more">+'+(a.length-3)+" أخرى</div>";
    h+="</div>";
  }
  $("view").innerHTML='<div class="grid">'+h+"</div>";
}
function tag(c){var t=c.start>TERM_E?"خارج الفصل":(c.start<TERM_S||c.end>TERM_E?"تمتد خارج الفصل":"");return t?' <span class="more">('+t+")</span>":""}
function renderList(){
  var q=$("q").value.trim().toLowerCase();
  var rows=vis().filter(function(c){return !q||(c.name+" "+c.ent).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0});
  if(!rows.length){$("view").innerHTML='<div class="tbl"><div class="empty">'+(data.length?"لا توجد نتائج مطابقة.":"لا توجد دورات بعد. اضغط «إضافة دورة» للبدء.")+"</div></div>";return}
  var h="<table><thead><tr><th>م</th><th>الدورة</th><th>الجهة</th><th>البداية</th><th>النهاية</th><th>المشاركون</th><th>الحالة</th></tr></thead><tbody>";
  rows.forEach(function(c,i){h+='<tr data-id="'+c.id+'"><td>'+(i+1)+"</td><td>"+esc(c.name)+tag(c)+"</td><td>"+esc(c.ent)+"</td><td>"+fmt(c.start)+"</td><td>"+fmt(c.end)+"</td><td>"+esc(c.n)+'</td><td><span class="pill" style="--c:'+ST[c.status]+'">'+c.status+"</span></td></tr>"});
  $("view").innerHTML='<div class="tbl">'+h+"</tbody></table></div>";
}
function renderWeeks(){
  var rows=[],mx=1;
  for(var w=0;w<14;w++){
    var s=new Date(2027,0,3+w*7),e=new Date(2027,0,7+w*7);
    var ks=iso(s.getFullYear(),s.getMonth()+1,s.getDate()),ke=iso(e.getFullYear(),e.getMonth()+1,e.getDate());
    var n=vis().filter(function(c){return c.start<=ke&&c.end>=ks}).length;mx=Math.max(mx,n);
    rows.push({w:w+1,n:n,l:s.getDate()+"/"+(s.getMonth()+1)+" – "+e.getDate()+"/"+(e.getMonth()+1)});
  }
  $("view").innerHTML='<div class="week">'+rows.map(function(r){return'<div class="wk"><small>أسبوع '+r.w+"</small><b>"+r.n+"</b><small>"+r.l+'</small><div style="width:'+(r.n/mx*100)+'%"></div></div>'}).join("")+"</div>";
}

function openM(id,date){
  editId=id||null;var c=id?data.filter(function(x){return x.id===id})[0]:null;
  $("mh").textContent=c?"تعديل الدورة":"إضافة دورة";
  $("fName").value=c?c.name:"";$("fVen").value=c?c.venue:"";$("fEnt").value=c?c.ent:($("fe").value||"");
  $("fS").value=c?c.start:(date||"");$("fE").value=c?c.end:(date||"");
  $("fT").value=c?c.time:"";$("fN").value=c?c.n:"";$("fSt").value=c?c.status:"مؤكدة";
  $("del").style.display=c?"":"none";$("err").textContent="";
  $("mask").classList.add("on");$("fName").focus();
}
function closeM(){$("mask").classList.remove("on")}
$("save").onclick=function(){
  var o={name:$("fName").value.trim(),ent:$("fEnt").value.trim(),venue:$("fVen").value.trim(),start:$("fS").value,end:$("fE").value,time:$("fT").value.trim(),n:$("fN").value,status:$("fSt").value};
  if(!o.name){$("err").textContent="اكتب اسم الدورة.";return}
  if(!o.start||!o.end){$("err").textContent="حدّد تاريخ البداية والنهاية.";return}
  if(o.end<o.start){$("err").textContent="تاريخ النهاية يجب أن يكون بعد البداية.";return}
  if(editId){data=data.map(function(c){return c.id===editId?Object.assign({},c,o):c})}
  else{o.id="c"+Date.now()+Math.floor(Math.random()*999);data.push(o)}
  persist();closeM();render();
};
$("del").onclick=function(){if(editId&&confirm("حذف هذه الدورة؟")){data=data.filter(function(c){return c.id!==editId});persist();closeM();render()}};
$("cancel").onclick=closeM;
$("mask").onclick=function(e){if(e.target===$("mask"))closeM()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
$("add").onclick=function(){openM()};
$("prev").onclick=function(){if(mi>0){mi--;render()}};
$("next").onclick=function(){if(mi<3){mi++;render()}};
$("q").oninput=renderList;
document.querySelector(".tabs").onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v){view=v;render()}};
$("view").onclick=function(e){
  var ch=e.target.closest("[data-id]");if(ch){openM(ch.dataset.id);return}
  var dy=e.target.closest(".day");if(dy&&dy.dataset.d)openM(null,dy.dataset.d);
};
render();
</script>
